name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape online-fix.me game list
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import time

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          games = []
          seen = set()

          # Scrape all category listing pages
          categories = [
              'adventures', 'arcade', 'horror', 'officialservers',
              'rpg', 'shooter', 'simulator', 'strategy', 'survival',
              'sandbox', 'sport', 'vr'
          ]

          for category in categories:
              page = 1
              while True:
                  if page == 1:
                      url = f'https://online-fix.me/games/{category}/'
                  else:
                      url = f'https://online-fix.me/games/{category}/page/{page}/'
                  
                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 404:
                          break
                      
                      soup = BeautifulSoup(r.content.decode('windows-1251', errors='replace'), 'html.parser')
                      
                      # Find game links matching pattern /games/category/id-name-po-seti.html
                      links = soup.find_all('a', href=True)
                      found_any = False
                      
                      for link in links:
                          href = link['href']
                          if '/games/' in href and 'po-seti' in href and href not in seen:
                              # Extract game name from URL
                              parts = href.rstrip('/').split('/')
                              if len(parts) >= 2:
                                  slug = parts[-1].replace('-po-seti.html', '').replace('-online.html', '')
                                  # Remove leading ID number
                                  slug_parts = slug.split('-')
                                  if slug_parts[0].isdigit():
                                      slug_parts = slug_parts[1:]
                                  name = ' '.join(slug_parts).title()
                                  
                                  # Also try to get title from link text or title attribute
                                  title = link.get('title', '') or link.get_text(strip=True)
                                  # Clean up Cyrillic "по сети" suffix
                                  for suffix in [' по сети', ' По Сети', ' Online', ' online']:
                                      if title.endswith(suffix):
                                          title = title[:-len(suffix)].strip()
                                  
                                  if title and not any(c in title for c in ['©', '→', '←']):
                                      games.append({'title': title})
                                      seen.add(href)
                                      found_any = True
                      
                      if not found_any:
                          break
                      
                      print(f'{category} page {page}: {len(games)} total games')
                      page += 1
                      time.sleep(0.5)
                      
                  except Exception as e:
                      print(f'Error on {url}: {e}')
                      break

          result = {'name': 'onlinefix', 'games': games}
          
          with open('onlinefix.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          
          print(f'Done - {len(games)} games saved')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
