name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape online-fix.me and resolve Steam AppIDs
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import time
          import re
          import os
          from datetime import datetime

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          def normalise(s):
              if not s:
                  return ''
              s = s.lower()
              s = re.sub(r'[™®©℠]', '', s)
              s = re.sub(r"'s\b", 's', s)
              s = re.sub(r"'", '', s)
              s = re.sub(r'[:!()\.\-&]', ' ', s)
              s = re.sub(r'[^\w\s]', ' ', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          # Load manual overrides if they exist
          manual_path = 'OnlineFix/manual_appids.json'
          manual_appids = {}
          if os.path.exists(manual_path):
              with open(manual_path, encoding='utf-8') as f:
                  manual_appids = json.load(f)
              print(f'Loaded {len(manual_appids)} manual AppID overrides')

          # Build Steam app lookup from json
          print('Fetching Steam app list...')
          r = requests.get('https://raw.githubusercontent.com/jsnli/steamappidlist/refs/heads/master/data/games_appid.json', timeout=60)
          if r.status_code != 200 or not r.text.strip():
              raise Exception(f'Steam app list failed: status={r.status_code}')
          steam_apps = r.json()

          steam_lookup = {}
          for app in steam_apps:
              name = app.get('name', '')
              app_id = str(app.get('appid', ''))
              if not name or not app_id:
                  continue
              key = normalise(name)
              if key not in steam_lookup:
                  steam_lookup[key] = []
              steam_lookup[key].append({'id': app_id, 'name': name})

          print(f'Steam app list loaded: {len(steam_apps)} apps')

          # Cache for game page info to avoid double fetching
          page_info_cache = {}

          def get_game_page_info(page_url):
              """Fetch game page once and extract both platform and release date."""
              if page_url in page_info_cache:
                  return page_info_cache[page_url]

              result = {'platform': 'Steam', 'release_date': None}

              try:
                  r = requests.get(page_url, headers=headers, timeout=15)
                  content = r.content.decode('windows-1251', errors='replace')

                  # Extract platform — "Игра через: Steam" or "Игра через: Epic" etc
                  platform_match = re.search(
                      r'[Ии]гра\s+через[:\s]+([^\n<]+)',
                      content
                  )
                  if platform_match:
                      platform_raw = platform_match.group(1).strip()
                      # Normalise platform name
                      p = platform_raw.lower()
                      if 'epic' in p:
                          result['platform'] = 'Epic'
                      elif 'steam' in p:
                          result['platform'] = 'Steam'
                      elif 'battle' in p or 'blizzard' in p:
                          result['platform'] = 'Battle.net'
                      elif 'xbox' in p or 'microsoft' in p:
                          result['platform'] = 'Xbox'
                      elif 'ubisoft' in p or 'uplay' in p:
                          result['platform'] = 'Ubisoft'
                      else:
                          result['platform'] = platform_raw

                  # Extract release date — "Релиз игры: 25.02.2022"
                  date_match = re.search(
                      r'[Рр]елиз\s+игры[:\s]+(\d{2}\.\d{2}\.\d{4})',
                      content
                  )
                  if date_match:
                      result['release_date'] = datetime.strptime(
                          date_match.group(1), '%d.%m.%Y'
                      ).date()

              except Exception as e:
                  print(f'  Page fetch error for {page_url}: {e}')

              page_info_cache[page_url] = result
              return result

          def get_steam_release_date(app_id):
              try:
                  url = f'https://store.steampowered.com/api/appdetails?appids={app_id}&l=english'
                  r = requests.get(url, timeout=10)
                  data = r.json()
                  app_data = data.get(str(app_id), {}).get('data', {})
                  date_str = app_data.get('release_date', {}).get('date', '')
                  if date_str:
                      try:
                          return datetime.strptime(date_str, '%d %b, %Y').date()
                      except:
                          try:
                              return datetime.strptime(date_str, '%b %d, %Y').date()
                          except:
                              pass
              except:
                  pass
              return None

          def resolve_appid(title, page_url):
              # Check manual overrides first
              if title in manual_appids:
                  print(f'  Manual override: {title} → {manual_appids[title]}')
                  return manual_appids[title]

              key = normalise(title)

              # Primary — JSON lookup
              matches = steam_lookup.get(key, [])

              if matches:
                  if len(matches) == 1:
                      return str(matches[0]['id'])

                  # Multiple matches — use release date
                  print(f'  Multiple matches for "{title}" — fetching release dates...')
                  info = get_game_page_info(page_url)
                  of_date = info['release_date']
                  if of_date is None:
                      return None
                  time.sleep(0.3)
                  for match in matches:
                      steam_date = get_steam_release_date(match['id'])
                      time.sleep(0.3)
                      if steam_date and steam_date == of_date:
                          print(f'  Matched by date {of_date} → {match["id"]}')
                          return str(match['id'])
                  return None

              # Fallback — Steam API search
              words = [w for w in title.split() if len(w) > 2]

              for num_words in range(2, min(4, len(words) + 1)):
                  search_term = ' '.join(words[:num_words])

                  try:
                      url = f'https://store.steampowered.com/api/storesearch?term={requests.utils.quote(search_term)}&l=english&cc=US'
                      r = requests.get(url, timeout=10)
                      items = r.json().get('items', [])
                  except:
                      continue

                  if not items:
                      continue

                  exact_matches = [
                      item for item in items
                      if normalise(item.get('name', '')) == key
                  ]

                  if not exact_matches:
                      continue

                  if len(exact_matches) == 1:
                      exact_key = normalise(exact_matches[0]['name'])
                      json_matches = steam_lookup.get(exact_key, [])
                      if json_matches:
                          return str(json_matches[0]['id'])
                      return str(exact_matches[0]['id'])

                  # Multiple API matches — use release date
                  info = get_game_page_info(page_url)
                  of_date = info['release_date']
                  if of_date is None:
                      return None
                  time.sleep(0.3)
                  for match in exact_matches:
                      steam_date = get_steam_release_date(match['id'])
                      time.sleep(0.3)
                      if steam_date and steam_date == of_date:
                          print(f'  Matched by date {of_date} → {match["id"]}')
                          return str(match['id'])

                  return None

              return None

          games = []
          unresolved = []
          seen = set()

          categories = [
              'adventures', 'arcade', 'horror', 'officialservers',
              'rpg', 'shooter', 'simulator', 'strategy', 'survival',
              'sandbox', 'sport', 'vr'
          ]

          for category in categories:
              page = 1
              while True:
                  if page == 1:
                      url = f'https://online-fix.me/games/{category}/'
                  else:
                      url = f'https://online-fix.me/games/{category}/page/{page}/'

                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 404:
                          break

                      soup = BeautifulSoup(r.content.decode('windows-1251', errors='replace'), 'html.parser')
                      links = soup.find_all('a', href=True)
                      found_any = False

                      for link in links:
                          href = link['href']
                          if '/games/' in href and 'po-seti' in href and '#' not in href and href not in seen:
                              title = link.get('title', '') or link.get_text(strip=True)
                              for suffix in [' по сети', ' По Сети', ' Online', ' online']:
                                  if title.endswith(suffix):
                                      title = title[:-len(suffix)].strip()

                              if title and not title.strip().isdigit():
                                  seen.add(href)
                                  found_any = True

                                  full_href = href if href.startswith('http') else f'https://online-fix.me{href}'

                                  # Fetch game page info (platform + release date)
                                  page_info = get_game_page_info(full_href)

                                  platform = page_info['platform']
                                  time.sleep(0.3)

                                  app_id = resolve_appid(title, full_href)
                                  time.sleep(0.3)

                                  entry = {'title': title, 'platform': platform}
                                  if app_id:
                                      entry['appId'] = app_id
                                      print(f'✓ {title} [{platform}] → {app_id}')
                                  else:
                                      print(f'✗ {title} [{platform}] → no match')
                                      unresolved.append({'title': title, 'platform': platform})

                                  games.append(entry)

                      if not found_any:
                          break

                      print(f'{category} page {page}: {len(games)} total games')
                      page += 1
                      time.sleep(0.5)

                  except Exception as e:
                      print(f'Error on {url}: {e}')
                      break

          # Write output files to OnlineFix folder
          os.makedirs('OnlineFix', exist_ok=True)

          with open('OnlineFix/onlinefix.json', 'w', encoding='utf-8') as f:
              json.dump({'name': 'onlinefix', 'games': games}, f, ensure_ascii=False, indent=2)

          with open('OnlineFix/unresolved.json', 'w', encoding='utf-8') as f:
              json.dump(unresolved, f, ensure_ascii=False, indent=2)

          if not os.path.exists(manual_path):
              with open(manual_path, 'w', encoding='utf-8') as f:
                  json.dump({}, f, ensure_ascii=False, indent=2)
              print('Created empty manual_appids.json')

          matched = sum(1 for g in games if 'appId' in g)
          print(f'Done - {len(games)} games, {matched} with AppID, {len(unresolved)} unresolved')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add OnlineFix/
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
