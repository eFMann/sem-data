name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch and strip hydralinks index
        run: |
          python3 -c "
          import asyncio
          from playwright.async_api import async_playwright
          import json

          async def fetch():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  await page.goto('https://hydralinks.cloud/sources/onlinefix.json', wait_until='networkidle')
                  content = await page.inner_text('body')
                  await browser.close()
                  
                  data = json.loads(content)
                  for entry in data.get('downloads', []):
                      entry.pop('uris', None)
                  
                  with open('onlinefix.json', 'w') as f:
                      json.dump(data, f)
                  
                  print(f'Done — {len(data[\"downloads\"])} entries')

          asyncio.run(fetch())
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
