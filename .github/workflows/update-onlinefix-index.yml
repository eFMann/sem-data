name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape online-fix.me and resolve Steam AppIDs
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import time
          import re
          from datetime import datetime

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          def normalise(s):
              if not s:
                  return ''
              s = s.lower()
              s = re.sub(r'[™®©℠]', '', s)
              s = re.sub(r"'s\b", 's', s)
              s = re.sub(r"'", '', s)
              s = re.sub(r'[:!()\.\-&]', ' ', s)
              s = re.sub(r'[^\w\s]', ' ', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          # Build Steam app lookup from complete app list
          print('Fetching Steam app list...')
          r = requests.get('https://api.steampowered.com/ISteamApps/GetAppList/v2/', timeout=30)
          steam_apps = r.json().get('applist', {}).get('apps', [])

          # Build normalised name → list of appids lookup
          steam_lookup = {}
          for app in steam_apps:
              name = app.get('name', '')
              app_id = str(app.get('appid', ''))
              if not name or not app_id:
                  continue
              key = normalise(name)
              if key not in steam_lookup:
                  steam_lookup[key] = []
              steam_lookup[key].append({'id': app_id, 'name': name})

          print(f'Steam app list loaded: {len(steam_apps)} apps')

          def get_onlinefix_release_date(page_url):
              try:
                  r = requests.get(page_url, headers=headers, timeout=15)
                  content = r.content.decode('windows-1251', errors='replace')
                  match = re.search(r'[Рр]елиз\s+игры[:\s]+(\d{2}\.\d{2}\.\d{4})', content)
                  if match:
                      return datetime.strptime(match.group(1), '%d.%m.%Y').date()
              except:
                  pass
              return None

          def get_steam_release_date(app_id):
              try:
                  url = f'https://store.steampowered.com/api/appdetails?appids={app_id}&l=english'
                  r = requests.get(url, timeout=10)
                  data = r.json()
                  app_data = data.get(str(app_id), {}).get('data', {})
                  date_str = app_data.get('release_date', {}).get('date', '')
                  if date_str:
                      try:
                          return datetime.strptime(date_str, '%d %b, %Y').date()
                      except:
                          try:
                              return datetime.strptime(date_str, '%b %d, %Y').date()
                          except:
                              pass
              except:
                  pass
              return None

          def resolve_appid(title, page_url):
              key = normalise(title)
              matches = steam_lookup.get(key, [])

              if not matches:
                  return None

              # Only one match — no ambiguity
              if len(matches) == 1:
                  return matches[0]['id']

              # Multiple matches — use release date to disambiguate
              print(f'  Multiple matches for "{title}" — fetching release dates...')

              of_date = get_onlinefix_release_date(page_url)
              if of_date is None:
                  return None

              time.sleep(0.3)

              for match in matches:
                  steam_date = get_steam_release_date(match['id'])
                  time.sleep(0.3)
                  if steam_date and steam_date == of_date:
                      print(f'  Matched by date {of_date} → {match["id"]}')
                      return match['id']

              return None

          games = []
          seen = set()

          categories = [
              'adventures', 'arcade', 'horror', 'officialservers',
              'rpg', 'shooter', 'simulator', 'strategy', 'survival',
              'sandbox', 'sport', 'vr'
          ]

          for category in categories:
              page = 1
              while True:
                  if page == 1:
                      url = f'https://online-fix.me/games/{category}/'
                  else:
                      url = f'https://online-fix.me/games/{category}/page/{page}/'

                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 404:
                          break

                      soup = BeautifulSoup(r.content.decode('windows-1251', errors='replace'), 'html.parser')
                      links = soup.find_all('a', href=True)
                      found_any = False

                      for link in links:
                          href = link['href']
                          if '/games/' in href and 'po-seti' in href and '#' not in href and href not in seen:
                              title = link.get('title', '') or link.get_text(strip=True)
                              for suffix in [' по сети', ' По Сети', ' Online', ' online']:
                                  if title.endswith(suffix):
                                      title = title[:-len(suffix)].strip()

                              if title and not title.strip().isdigit():
                                  seen.add(href)
                                  found_any = True

                                  app_id = resolve_appid(title, href)

                                  entry = {'title': title}
                                  if app_id:
                                      entry['appId'] = app_id
                                      print(f'✓ {title} → {app_id}')
                                  else:
                                      print(f'✗ {title} → no match')

                                  games.append(entry)

                      if not found_any:
                          break

                      print(f'{category} page {page}: {len(games)} total games')
                      page += 1
                      time.sleep(0.5)

                  except Exception as e:
                      print(f'Error on {url}: {e}')
                      break

          result = {'name': 'onlinefix', 'games': games}

          with open('onlinefix.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          matched = sum(1 for g in games if 'appId' in g)
          print(f'Done - {len(games)} games, {matched} with AppID')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
