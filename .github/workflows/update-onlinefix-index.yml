name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch and strip hydralinks index
        run: |
          python3 << 'EOF'
          import asyncio
          from playwright.async_api import async_playwright
          from playwright_stealth import stealth_async
          import json

          async def fetch():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
                  )
                  page = await context.new_page()
                  await stealth_async(page)
                  
                  result = {}
                  
                  async def handle_response(response):
                      if 'onlinefix.json' in response.url and response.status == 200:
                          try:
                              text = await response.text()
                              if text.strip().startswith('{'):
                                  result['body'] = text
                          except:
                              pass
                  
                  page.on('response', handle_response)
                  
                  try:
                      await page.goto('https://hydralinks.cloud/sources/onlinefix.json',
                                      wait_until='domcontentloaded',
                                      timeout=60000)
                  except:
                      pass
                  
                  for i in range(20):
                      if 'body' in result:
                          break
                      await asyncio.sleep(1)
                  
                  await browser.close()
                  
                  if 'body' not in result:
                      raise Exception('No JSON response received')
                  
                  data = json.loads(result['body'])
                  for entry in data.get('downloads', []):
                      entry.pop('uris', None)
                  
                  with open('onlinefix.json', 'w') as f:
                      json.dump(data, f)
                  
                  print(f'Done - {len(data.get("downloads", []))} entries')

          asyncio.run(fetch())
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
