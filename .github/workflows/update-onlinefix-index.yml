name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape online-fix.me and resolve Steam AppIDs
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import time
          import re

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          def normalise(s):
              if not s:
                  return ''
              s = s.lower()
              s = re.sub(r'[™®©℠]', '', s)
              s = re.sub(r"'s\b", 's', s)
              s = re.sub(r"'", '', s)
              s = re.sub(r'[:!()\.\-&]', ' ', s)
              s = re.sub(r'[^\w\s]', ' ', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def resolve_appid(title):
              try:
                  url = f'https://store.steampowered.com/api/storesearch?term={requests.utils.quote(title)}&l=english&cc=US'
                  r = requests.get(url, timeout=10)
                  data = r.json()
                  items = data.get('items', [])
                  if not items:
                      return None
                  
                  needle = normalise(title)
                  for item in items[:5]:
                      candidate = normalise(item.get('name', ''))
                      if candidate == needle:
                          return str(item['id'])
                  
                  return None
              except:
                  return None

          games = []
          seen = set()

          categories = [
              'adventures', 'arcade', 'horror', 'officialservers',
              'rpg', 'shooter', 'simulator', 'strategy', 'survival',
              'sandbox', 'sport', 'vr'
          ]

          for category in categories:
              page = 1
              while True:
                  if page == 1:
                      url = f'https://online-fix.me/games/{category}/'
                  else:
                      url = f'https://online-fix.me/games/{category}/page/{page}/'
                  
                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 404:
                          break
                      
                      soup = BeautifulSoup(r.content.decode('windows-1251', errors='replace'), 'html.parser')
                      links = soup.find_all('a', href=True)
                      found_any = False
                      
                      for link in links:
                          href = link['href']
                          if '/games/' in href and 'po-seti' in href and href not in seen:
                              print(f'DEBUG href={href}, text={link.get_text(strip=True)[:30]}')
                              title = link.get('title', '') or link.get_text(strip=True)
                              for suffix in [' по сети', ' По Сети', ' Online', ' online']:
                                  if title.endswith(suffix):
                                      title = title[:-len(suffix)].strip()
                              
                              if title and not any(c in title for c in ['©', '→', '←']):
                                  seen.add(href)
                                  found_any = True
                                  
                                  # Resolve Steam AppID
                                  app_id = resolve_appid(title)
                                  time.sleep(0.3)  # polite delay for Steam API
                                  
                                  entry = {'title': title}
                                  if app_id:
                                      entry['appId'] = app_id
                                      print(f'✓ {title} → {app_id}')
                                  else:
                                      print(f'✗ {title} → no match')
                                  
                                  games.append(entry)
                      
                      if not found_any:
                          break
                      
                      print(f'{category} page {page}: {len(games)} total games')
                      page += 1
                      time.sleep(0.5)
                      
                  except Exception as e:
                      print(f'Error on {url}: {e}')
                      break

          result = {'name': 'onlinefix', 'games': games}
          
          with open('onlinefix.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          
          print(f'Done - {len(games)} games, {sum(1 for g in games if "appId" in g)} with AppID')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
