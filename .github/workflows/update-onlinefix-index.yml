name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape online-fix.me and resolve Steam AppIDs
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import time
          import re
          import os
          from datetime import datetime

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          def normalise(s):
              if not s:
                  return ''
              s = s.lower()
              s = re.sub(r'[™®©℠]', '', s)
              s = re.sub(r"'s\b", 's', s)
              s = re.sub(r"'", '', s)
              s = re.sub(r'[:!()\.\-&]', ' ', s)
              s = re.sub(r'[^\w\s]', ' ', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          def extract_platform_from_entry(entry_html):
              program_links = re.findall(
                  r'(?:programs|files/progs)/(\d+)-[^"]+\.html',
                  entry_html,
                  re.IGNORECASE
              )

              has_steam = '16108' in program_links
              has_epic = '16106' in program_links or bool(re.search(r'Epic\s+Games?\s+Store', entry_html, re.IGNORECASE))
              has_microsoft = '16760' in program_links or bool(re.search(r'Microsoft Store|аккаунт Microsoft', entry_html, re.IGNORECASE))
              has_battlenet = '16107' in program_links or bool(re.search(r'Battle\.net', entry_html, re.IGNORECASE))
              has_ubisoft = '16109' in program_links or bool(re.search(r'Ubisoft Connect', entry_html, re.IGNORECASE))
              has_ea = bool(re.search(r'Electronic Arts|EA App', entry_html, re.IGNORECASE))
              has_lan = bool(re.search(r'tags/(?:lan|vpn)', entry_html, re.IGNORECASE))
              has_gog = '16339' in program_links or bool(re.search(r'GOG\s*Galaxy|GOG', entry_html, re.IGNORECASE))
              has_steam_remote = bool(re.search(r'Steam Remote Play', entry_html, re.IGNORECASE))
              has_internet = bool(re.search(r'Интернет', entry_html))

              if has_steam and has_epic:
                  return 'Steam + Epic'
              elif has_steam and has_microsoft:
                  return 'Steam + Microsoft'
              elif has_steam and has_ea:
                  return 'Steam + EA'
              elif has_steam and has_gog:
                  return 'Steam + GOG Galaxy'
              elif has_steam and has_lan:
                  return 'Steam + LAN'
              elif has_epic:
                  return 'Epic'
              elif has_microsoft:
                  return 'Microsoft Store'
              elif has_ea:
                  return 'EA'
              elif has_battlenet:
                  return 'Battle.net'
              elif has_ubisoft:
                  return 'Ubisoft'
              elif has_gog:
                  return 'GOG Galaxy'
              elif has_lan:
                  return 'LAN'
              elif has_steam_remote:
                  return 'Steam Remote Play'
              elif has_internet:
                  return 'Internet'
              elif has_steam:
                  return 'Steam'
              else:
                  return 'Unknown'

          def extract_release_date(entry_html):
              match = re.search(r'(\d{2}\.\d{2}\.\d{4})', entry_html)
              if match:
                  try:
                      return datetime.strptime(match.group(1), '%d.%m.%Y').date()
                  except:
                      pass
              return None

          # Load manual overrides
          manual_path = 'OnlineFix/manual_appids.json'
          manual_appids = {}
          if os.path.exists(manual_path):
              with open(manual_path, encoding='utf-8') as f:
                  manual_appids = json.load(f)
              print(f'Loaded {len(manual_appids)} manual AppID overrides')

          # Build Steam app lookup from json
          print('Fetching Steam app list...')
          r = requests.get('https://raw.githubusercontent.com/jsnli/steamappidlist/refs/heads/master/data/games_appid.json', timeout=60)
          if r.status_code != 200 or not r.text.strip():
              raise Exception(f'Steam app list failed: status={r.status_code}')
          steam_apps = r.json()

          steam_lookup = {}
          for app in steam_apps:
              name = app.get('name', '')
              app_id = str(app.get('appid', ''))
              if not name or not app_id:
                  continue
              key = normalise(name)
              if key not in steam_lookup:
                  steam_lookup[key] = []
              steam_lookup[key].append({'id': app_id, 'name': name})

          print(f'Steam app list loaded: {len(steam_apps)} apps')

          def get_steam_release_date(app_id):
              try:
                  url = f'https://store.steampowered.com/api/appdetails?appids={app_id}&l=english'
                  r = requests.get(url, timeout=10)
                  data = r.json()
                  app_data = data.get(str(app_id), {}).get('data', {})
                  date_str = app_data.get('release_date', {}).get('date', '')
                  if date_str:
                      try:
                          return datetime.strptime(date_str, '%d %b, %Y').date()
                      except:
                          try:
                              return datetime.strptime(date_str, '%b %d, %Y').date()
                          except:
                              pass
              except:
                  pass
              return None

          def resolve_appid(title, release_date):
              if title in manual_appids:
                  return manual_appids[title]

              key = normalise(title)
              matches = steam_lookup.get(key, [])

              if matches:
                  if len(matches) == 1:
                      return str(matches[0]['id'])
                  if release_date is None:
                      return None
                  for match in matches:
                      steam_date = get_steam_release_date(match['id'])
                      time.sleep(0.3)
                      if steam_date and steam_date == release_date:
                          return str(match['id'])
                  return None

              words = [w for w in title.split() if len(w) > 2]
              for num_words in range(2, min(4, len(words) + 1)):
                  search_term = ' '.join(words[:num_words])
                  try:
                      url = f'https://store.steampowered.com/api/storesearch?term={requests.utils.quote(search_term)}&l=english&cc=US'
                      r = requests.get(url, timeout=10)
                      items = r.json().get('items', [])
                  except:
                      continue

                  if not items:
                      continue

                  exact_matches = [
                      item for item in items
                      if normalise(item.get('name', '')) == key
                  ]

                  if not exact_matches:
                      continue

                  if len(exact_matches) == 1:
                      exact_key = normalise(exact_matches[0]['name'])
                      json_matches = steam_lookup.get(exact_key, [])
                      if json_matches:
                          return str(json_matches[0]['id'])
                      return str(exact_matches[0]['id'])

                  if release_date is None:
                      return None
                  for match in exact_matches:
                      steam_date = get_steam_release_date(match['id'])
                      time.sleep(0.3)
                      if steam_date and steam_date == release_date:
                          return str(match['id'])

                  return None

              return None

          games = []
          unresolved = []
          seen = set()

          categories = [
              'adventures', 'arcade', 'fighting', 'horror',
              'officialservers', 'puzzles', 'racing', 'rpg',
              'shooter', 'simulator', 'strategy', 'survival',
              'sandbox', 'sport', 'vr'
          ]

          for category in categories:
              page = 1
              while True:
                  if page == 1:
                      url = f'https://online-fix.me/games/{category}/'
                  else:
                      url = f'https://online-fix.me/games/{category}/page/{page}/'

                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 404:
                          break

                      content = r.content.decode('windows-1251', errors='replace')
                      soup = BeautifulSoup(content, 'html.parser')

                      # Target only the main content area to avoid sidebar links
                      main_content = soup.find('div', id='dle-content')
                      if not main_content:
                          main_content = soup

                      found_any = False
                      links = main_content.find_all('a', href=True)

                      for link in links:
                          href = link['href']
                          if '/games/' in href and ('-po-seti' in href or href.endswith('-online.html')) and '#' not in href and href not in seen:
                              title = link.get('title', '') or link.get_text(strip=True)
                              for suffix in [' по сети', ' По Сети', ' Online', ' online']:
                                  if title.endswith(suffix):
                                      title = title[:-len(suffix)].strip()

                              if not title or title.strip().isdigit():
                                  continue

                              seen.add(href)
                              found_any = True

                              # Walk up to find the entry container
                              parent = link.parent
                              for _ in range(8):
                                  if parent is None:
                                      break
                                  if parent.name in ['article', 'section'] or (
                                      parent.name == 'div'
                                      and len(str(parent)) > 500
                                  ):
                                      break
                                  parent = parent.parent

                              entry_html = str(parent) if parent else ''

                              platform = extract_platform_from_entry(entry_html)
                              release_date = extract_release_date(entry_html)

                              app_id = resolve_appid(title, release_date)
                              time.sleep(0.3)

                              entry = {'title': title, 'platform': platform}
                              if app_id:
                                  entry['appId'] = app_id
                                  print(f'✓ {title} [{platform}] → {app_id}')
                              else:
                                  print(f'✗ {title} [{platform}] → no match')
                                  unresolved.append({'title': title, 'platform': platform})

                              games.append(entry)

                      if not found_any:
                          break

                      print(f'{category} page {page}: {len(games)} total games')
                      page += 1
                      time.sleep(0.5)

                  except Exception as e:
                      print(f'Error on {url}: {e}')
                      break

          os.makedirs('OnlineFix', exist_ok=True)

          with open('OnlineFix/onlinefix.json', 'w', encoding='utf-8') as f:
              json.dump({'name': 'onlinefix', 'games': games}, f, ensure_ascii=False, indent=2)

          with open('OnlineFix/unresolved.json', 'w', encoding='utf-8') as f:
              json.dump(unresolved, f, ensure_ascii=False, indent=2)

          if not os.path.exists(manual_path):
              with open(manual_path, 'w', encoding='utf-8') as f:
                  json.dump({}, f, ensure_ascii=False, indent=2)

          matched = sum(1 for g in games if 'appId' in g)
          print(f'Done - {len(games)} games, {matched} with AppID, {len(unresolved)} unresolved')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add OnlineFix/
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
