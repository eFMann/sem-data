name: Update Online-Fix Index

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch and strip hydralinks index
        run: |
          docker run --rm \
            lwthiker/curl-impersonate:0.5-chrome \
            curl_chrome110 \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -o /tmp/raw.json \
            https://hydralinks.cloud/sources/onlinefix.json
          
          python3 -c "
          import json
          with open('/tmp/raw.json') as f:
              data = json.load(f)
          for entry in data.get('downloads', []):
              entry.pop('uris', None)
          with open('onlinefix.json', 'w') as f:
              json.dump(data, f)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onlinefix.json
          git diff --staged --quiet || git commit -m "Update onlinefix index"
          git push
