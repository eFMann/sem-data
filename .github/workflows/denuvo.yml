name: Update Denuvo Index

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Query PCGamingWiki for Denuvo data
        env:
          PCGW_BOT_USER: ${{ secrets.PCGW_BOT_USER }}
          PCGW_BOT_PASS: ${{ secrets.PCGW_BOT_PASS }}
        run: |
          python3 << 'EOF'
          import requests, json, os, time

          API = 'https://www.pcgamingwiki.com/w/api.php'
          session = requests.Session()
          session.headers['User-Agent'] = 'DenuvoDB/1.0 (github.com/Efmann)'

          # Step 1: Get login token
          r = session.get(API, params={
              'action': 'query',
              'meta': 'tokens',
              'type': 'login',
              'format': 'json'
          })
          token = r.json()['query']['tokens']['logintoken']

          # Step 2: Authenticate
          r = session.post(API, data={
              'action': 'login',
              'lgname': os.environ['PCGW_BOT_USER'],
              'lgpassword': os.environ['PCGW_BOT_PASS'],
              'lgtoken': token,
              'format': 'json'
          })
          result = r.json()['login']['result']
          if result != 'Success':
              raise Exception(f'Login failed: {result}')
          print('Authenticated with PCGamingWiki')

          # Step 3: Query helper
          def query_denuvo(where_clause, label):
              results = []
              offset = 0
              while True:
                  r = session.get(API, params={
                      'action': 'cargoquery',
                      'tables': 'Availability,Game',
                      'join_on': 'Availability._pageID=Game._pageID',
                      'fields': 'Game._pageName=Page,Game.Steam_AppID=AppID,Availability.Uses_DRM=UsesDRM,Availability.Removed_DRM=RemovedDRM',
                      'where': where_clause,
                      'limit': '100',
                      'offset': str(offset),
                      'format': 'json'
                  })
                  data = r.json()

                  if 'error' in data:
                      print(f'Query error ({label}): {data["error"]["info"]}')
                      break

                  rows = data.get('cargoquery', [])
                  if not rows:
                      break

                  for row in rows:
                      results.append(row.get('title', {}))

                  print(f'{label}: fetched {len(results)} entries (offset {offset})')
                  offset += 100
                  time.sleep(2)

              return results

          # Step 4: Two queries — active and removed
          active_rows = query_denuvo(
              'Availability.Uses_DRM HOLDS LIKE "%Denuvo Anti-Tamper%"',
              'Active Denuvo'
          )

          removed_rows = query_denuvo(
              'Availability.Removed_DRM HOLDS LIKE "%Denuvo Anti-Tamper%"',
              'Removed Denuvo'
          )

          print(f'\nRaw results: {len(active_rows)} active rows, {len(removed_rows)} removed rows')

          # Step 5: Deduplicate and build index
          games = {}

          for row in active_rows:
              page = row.get('Page', '')
              if not page or page in games:
                  continue
              app_ids = row.get('AppID', '')
              first_id = app_ids.split(',')[0].strip() if app_ids else ''
              games[page] = {
                  'name': page,
                  'appId': first_id,
                  'status': 'active'
              }

          for row in removed_rows:
              page = row.get('Page', '')
              if not page:
                  continue
              app_ids = row.get('AppID', '')
              first_id = app_ids.split(',')[0].strip() if app_ids else ''
              if page not in games:
                  games[page] = {
                      'name': page,
                      'appId': first_id,
                      'status': 'removed'
                  }
              else:
                  games[page]['status'] = 'removed'

          game_list = sorted(games.values(), key=lambda g: g['name'])

          # Step 6: Fill missing App IDs via Steam store search
          import re

          def normalise(s):
              if not s:
                  return ''
              s = s.lower()
              s = re.sub(r'[™®©℠]', '', s)
              s = re.sub(r'\s*\(\d{4}\)', '', s)  # Remove year suffixes like (2017)
              s = re.sub(r'[^\w\s]', ' ', s)
              s = re.sub(r'\s+', ' ', s).strip()
              return s

          missing = [g for g in game_list if not g['appId']]
          print(f'\n{len(missing)} games missing App IDs, searching Steam...')

          for game in missing:
              search_name = game['name']
              try:
                  r = session.get(
                      f'https://store.steampowered.com/api/storesearch',
                      params={'term': search_name, 'l': 'english', 'cc': 'US'},
                      timeout=10
                  )
                  items = r.json().get('items', [])
                  norm_name = normalise(search_name)

                  for item in items:
                      if normalise(item.get('name', '')) == norm_name:
                          game['appId'] = str(item['id'])
                          print(f'  ✓ {search_name} → {item["id"]}')
                          break
                  else:
                      print(f'  ✗ {search_name} → not on Steam')

              except Exception as e:
                  print(f'  ✗ {search_name} → error: {e}')

              time.sleep(0.5)


          os.makedirs('Denuvo', exist_ok=True)
          with open('Denuvo/denuvo.json', 'w', encoding='utf-8') as f:
              json.dump(game_list, f, ensure_ascii=False, indent=2)

          active = sum(1 for g in game_list if g['status'] == 'active')
          removed = sum(1 for g in game_list if g['status'] == 'removed')
          print(f'Done — {len(game_list)} total, {active} active, {removed} removed')
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Denuvo/
          git diff --staged --quiet || git commit -m "Update Denuvo index"
          git push
